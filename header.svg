<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 140" width="800" height="140" role="img" aria-label="Hi, Engy Refaai - AI Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="reveal">
      <rect x="170" y="10" height="80" width="0">
        <animate attributeName="width" values="0;0;450;450" keyTimes="0;0.27;0.42;1" dur="10s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <text x="400" y="75" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="64" font-weight="700" fill="#E0548F" opacity="0">
    Hi!
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.2;0.25;1" dur="10s" repeatCount="indefinite"/>
  </text>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.27;0.92;0.97;1" dur="10s" repeatCount="indefinite"/>
    <g clip-path="url(#reveal)">
      <text x="400" y="75" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="58" font-weight="700" fill="#E0548F">Engy Refaai</text>
    </g>
  </g>

  <text x="400" y="115" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="20" letter-spacing="6" fill="#F08DB5" opacity="0">
    AI ENGINEER
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.44;0.52;0.92;0.97;1" dur="10s" repeatCount="indefinite"/>
  </text>
</svg>